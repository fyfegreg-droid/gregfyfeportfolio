name: Fetch school logos
on:
  push:
    paths: ['.github/workflows/fetch-logos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/img/logos
          cd assets/img/logos
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ curl -sSL -A "$UA" -o "$1" "$2" || echo "fail $1"; }
          get unc-master.png "https://brand.charlotte.edu/wp-content/uploads/sites/183/2023/04/8716-01-Charlotte-Master-File-v7_1.png"
          get unc-horizontal.png "https://brand.charlotte.edu/wp-content/uploads/sites/183/2023/04/Master_horizontal.png"
          get unc-c.png "https://brand.charlotte.edu/wp-content/uploads/sites/183/2022/12/All-in-C.png"
          get spcc-dark.png "https://spcc.edu/wp-content/uploads/2024/10/site-logo-dark-full.png"
          get spcc-ol.png "https://spcc.edu/wp-content/uploads/2025/01/SPCC_OL_CMYK-1.png"
          get spcc-icon.png "https://spcc.edu/wp-content/uploads/2025/05/SP-Web-Icon-300x300.png"
          file * ; ls -la
      - run: |
          git config user.name "Greg Fyfe"
          git config user.email "fyfegreg@users.noreply.github.com"
          git add assets/img/logos
          git commit -m "Add school logo candidates" || echo nothing
          git push
