name: Fetch Wix assets
on:
  push:
    paths: ['.github/workflows/fetch-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -e
          dl() { mkdir -p "$(dirname "$2")"; curl -fsSL --retry 3 -o "$2" "$1"; echo "ok $2 $(stat -c%s "$2")"; }
